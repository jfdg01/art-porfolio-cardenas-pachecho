<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>2 · Pared de salón — prototipo</title>
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;600&display=swap"
		/>
		<link rel="stylesheet" href="common.css" />
		<style>
			:root {
				--serif: 'Cormorant Garamond', serif;
				--sans: 'Karla', sans-serif;
			}
			.label .title {
				font-size: 1.375rem;
				font-weight: 600;
			}
			main {
				flex: 1;
				overflow: hidden auto;
				padding: clamp(1.5rem, 5vw, 4rem);
			}
			h1 {
				font: 500 clamp(2rem, 5vw, 3.25rem) / 1.1 var(--serif);
				margin-bottom: 2.5rem;
			}
			/* A salon hang: masonry columns, each work with its Label under it */
			.salon {
				columns: 4 16rem;
				column-gap: clamp(2rem, 4vw, 4rem);
			}
			.salon .work {
				break-inside: avoid;
				margin-bottom: clamp(2.5rem, 5vw, 4.5rem);
			}
			.salon .canvas {
				width: min(100%, calc(75dvh * var(--r)));
			}
			.salon .label {
				margin-top: 1rem;
			}
		</style>
	</head>
	<body>
		<header id="site"></header>
		<main class="walk">
			<h1>Obra</h1>
			<div class="salon"></div>
		</main>
		<script type="module">
			import { ARTWORKS, work, siteHeader } from './common.js';
			siteHeader('2 · Pared de salón · Cormorant Garamond + Karla');
			document.querySelector('.salon').innerHTML = ARTWORKS.map(work).join('');
		</script>
	</body>
</html>
