<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>1 · Corredor por las Salas — prototipo</title>
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=Space+Grotesk:wght@400;600&display=swap"
		/>
		<link rel="stylesheet" href="vendor/bigger-picture.css" />
		<link rel="stylesheet" href="common.css" />
		<style>
			:root {
				--serif: 'Source Serif 4', serif;
				--sans: 'Space Grotesk', sans-serif;
			}
			.rooms {
				display: flex;
				align-items: center;
				gap: 0.25rem 1.5rem;
				flex-wrap: wrap;
				padding: 0.5rem clamp(1rem, 4vw, 3rem);
				border-bottom: 1px solid var(--line);
				font-size: 1rem;
			}
			.rooms ul {
				position: relative; /* offsetLeft of a Room counts from the strip */
				flex: 1;
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(5rem, 1fr));
				gap: 0.25rem 0.5rem;
				padding: 0;
				list-style: none;
				font-size: 0.9375rem;
			}
			/* Each Room shows one of its works above its name, so the list reads at a glance */
			.rooms a {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.35rem;
				padding: 0.35rem 0;
				text-decoration: none;
				color: var(--muted);
			}
			.rooms img {
				width: min(4.5rem, 100%);
				height: 3.25rem;
				object-fit: cover;
				opacity: 0.75;
			}
			.rooms a:hover img,
			.rooms a[aria-current] img {
				opacity: 1;
			}
			.rooms a[aria-current] img {
				outline: 2px solid var(--ink);
				outline-offset: 2px;
			}
			.rooms a[aria-current] {
				color: var(--ink);
			}
			.rooms a[aria-current] span {
				text-decoration: underline;
				text-underline-offset: 0.35em;
			}
			/* A Room door: the name of the Room, big, on the wall of the corridor */
			.door {
				width: 22rem;
				border-left: 1px solid var(--muted);
				padding: 2rem 0 2rem 2rem;
			}
			.door p {
				color: var(--muted);
			}
			.door h2 {
				font: italic 400 clamp(2.5rem, 6vw, 4.5rem) / 1 var(--serif);
				margin: 0.5rem 0 1rem;
			}
			/* The bottom bar: the walk buttons in the middle, the view switch at the side */
			.controls {
				display: grid;
				grid-template-columns: 1fr auto 1fr;
			}
			.walking {
				display: flex;
				align-items: center;
				gap: 1.5rem;
			}
			.views {
				grid-column: 3; /* the same place in both views */
				justify-self: end;
				display: flex;
			}
			.views button + button {
				border-left: 0;
			}
			/* "Ver todas": every Room at once, small uncropped images with a short Label */
			.mass {
				flex: 1;
				overflow: hidden auto;
				padding: 1.5rem clamp(1rem, 4vw, 3rem) 4rem;
			}
			.mass section + section {
				margin-top: 3.5rem;
			}
			.mass h2 {
				font: italic 400 2.25rem/1.1 var(--serif);
				margin-bottom: 1.25rem;
			}
			.mass h2 small {
				margin-left: 0.75rem;
				font: 1rem var(--sans);
				color: var(--muted);
			}
			/* Masonry: uncropped images in columns, each with its short Label */
			.mass ul {
				columns: 6 11rem;
				column-gap: 1.75rem;
				padding: 0;
				list-style: none;
			}
			.mass li {
				break-inside: avoid;
				margin-bottom: 2rem;
			}
			.mass a {
				display: block;
				text-decoration: none;
			}
			.mass img {
				display: block;
				width: 100%;
				height: auto;
			}
			.mass a:hover img,
			.mass a:focus-visible img {
				outline: 2px solid var(--ink);
				outline-offset: 3px;
			}
			.mass a:hover .title {
				text-decoration: underline;
			}
			.mass .label {
				margin-top: 0.5rem;
			}
			.mass .label .title {
				font-size: 1rem;
			}
			.canvas {
				cursor: zoom-in;
			}
			/* Full View (bigger-picture): the dark wall behind, sharp shapes, the variant's fonts */
			.bp-wrap > div:first-child {
				background: rgb(20 19 17);
			}
			.bp-cap {
				border-radius: 0;
				background: var(--wall);
				font: 1.0625rem/1.3 var(--serif);
			}
			.bp-count {
				font: 0.9375rem/1 var(--sans);
			}
			/* Back to the top: only on the phone walk, once the header is gone */
			.top {
				display: none;
			}
			/* The site links again at the end of the phone walk */
			.end {
				display: none;
				padding: 2rem 1rem 3rem;
				border-top: 1px solid var(--line);
			}
			.end ul {
				display: flex;
				flex-wrap: wrap;
				gap: 0.25rem 1.5rem;
				padding: 0;
				list-style: none;
			}
			.end a {
				display: inline-block;
				padding: 0.5rem 0;
			}
			.end .proto {
				position: static;
				flex-wrap: wrap;
				margin-top: 2rem;
			}
			.end .proto span,
			.end .proto a {
				display: inline;
			}
			/* Portrait phone: the name stays on top while the site links scroll away. The header is
			   sticky with a negative top (--hide, the links row, measured in JS), and the strip
			   sticks right under what is left of it (--site-h). */
			@media (max-width: 700px) {
				#site {
					position: sticky;
					top: calc(-1 * var(--hide, 0px));
					z-index: 3;
					background: var(--wall);
				}
				#site nav {
					grid-row: 1;
				}
				#site {
					align-items: center;
					row-gap: 0.625rem; /* the part of the header that stays: this gap, the name, the padding */
					padding-bottom: 0.625rem;
				}
				#site .name {
					grid-row: 2;
					font-weight: 600;
					font-size: clamp(1.125rem, 5.4vw, 1.5rem); /* one line beside the switch, down to 360 px */
				}
				#site .views {
					grid-area: 2 / 2;
					align-self: center;
				}
				.rooms {
					top: var(--site-h, 0px) !important;
				}
				.corridor > * {
					scroll-margin-top: calc(var(--site-h, 0px) + 4rem);
				}
				.mass section {
					scroll-margin-top: calc(var(--site-h, 0px) + 5rem);
				}
			}
			/* Phone: the Room strip is the one control that stays, one tap target high */
			@media (max-width: 700px), (max-height: 500px) {
				.rooms {
					position: sticky;
					top: 0;
					z-index: 2;
					flex-wrap: nowrap;
					padding: 0.375rem 0;
					background: var(--wall);
				}
				.rooms > span {
					display: none;
				}
				.rooms ul {
					display: flex;
					gap: 0.5rem;
					overflow-x: auto;
					padding: 0 1rem;
					scrollbar-width: none;
				}
				.rooms ul {
					min-width: 0;
				}
				/* The language link sits first in the strip */
				.rooms {
					gap: 0;
				}
				.rooms .lang {
					flex: none;
					height: 2.75rem;
					margin-left: 1rem;
					padding: 0 1rem 0 0;
					border: 0;
					border-right: 1px solid var(--line);
					color: var(--ink);
					text-decoration: underline;
					text-underline-offset: 0.25em;
				}
				.rooms li {
					flex: none;
				}
				/* The view switch sits beside the name; it shows only the other view. Both buttons
				   share one cell, so the switch keeps one width and the name never moves. */
				#site .views {
					display: grid;
				}
				#site .views button {
					grid-area: 1 / 1;
					height: 2.75rem;
					padding: 0 0.75rem;
					font-size: 0.9375rem;
					background: var(--ink);
					color: var(--wall);
				}
				#site .views [aria-pressed='true'] {
					visibility: hidden;
				}
				/* "Ver todas" on a phone: the page scrolls, a masonry of three columns, no Labels */
				.mass {
					overflow: visible;
					padding: 0 1rem 3rem;
				}
				.mass section + section {
					margin-top: 2.5rem;
				}
				.mass h2 {
					font-size: 1.75rem;
					margin: 1.5rem 0 0.75rem;
				}
				.mass ul {
					columns: 3;
					column-gap: 0.25rem;
				}
				.mass li {
					margin-bottom: 0.25rem;
				}
				.mass .label {
					display: none;
				}
				.rooms a {
					flex-direction: row;
					gap: 0.6rem;
					height: 2.75rem;
					padding: 0 0.8rem 0 0;
					border: 1px solid var(--line);
				}
				.rooms img {
					width: 2.75rem;
					height: 100%;
				}
				.rooms a[aria-current] {
					border-color: var(--ink);
				}
				.rooms a[aria-current] img {
					outline: none;
				}
				.rooms a[aria-current] span {
					text-decoration: none;
				}
				.door {
					width: auto;
					border: 0;
					padding: 0;
				}
				.door h2 {
					font-size: 2.5rem;
					margin: 0.25rem 0 0.5rem;
				}
				.end {
					display: block;
				}
				.controls {
					display: none; /* the page's grid rule above would win over common.css */
				}
				/* Sticky, not fixed: the body holds the perspective, and fixed would scroll with it */
				.top {
					display: block;
					position: sticky;
					bottom: 1rem;
					z-index: 3;
					width: max-content;
					margin: 0 1rem 0 auto;
					background: var(--ink);
					color: var(--wall);
					border-color: var(--ink);
					box-shadow: 0 0.5rem 1.5rem rgb(0 0 0 / 0.6);
				}
			}
		</style>
	</head>
	<body>
		<header id="site"></header>
		<nav class="rooms" aria-label="Salas">
			<span>Salas:</span>
			<ul></ul>
		</nav>
		<main class="walk corridor" tabindex="-1"></main>
		<main class="mass" hidden></main>
		<nav class="end" aria-label="Principal, al final"></nav>
		<div class="controls">
			<span></span>
			<div class="walking">
				<button id="prev" type="button">← Anterior</button>
				<output aria-live="polite"></output>
				<button id="next" type="button">Siguiente →</button>
			</div>
			<div class="views" role="group" aria-label="Vista">
				<button type="button" data-view="paseo">Paseo</button>
				<button type="button" data-view="todas">Ver todas</button>
			</div>
		</div>
		<button class="top" type="button" hidden>↑ Arriba</button>
		<script type="module">
			import { ROOMS, ARTWORKS, inRoom, work, esc, siteHeader, corridor, PHONE } from './common.js';
			import BiggerPicture from './vendor/bigger-picture.min.mjs';
			siteHeader('1 · Corredor por las Salas · Source Serif 4 + Space Grotesk');

			const rooms = ROOMS.map((r) => ({ ...r, works: inRoom(r.tag) }));
			// A random work stands for each Room, a different one per Room where the Room allows it.
			const used = new Set();
			for (const r of rooms) {
				const free = r.works.filter((a) => !used.has(a));
				const pool = free.length ? free : r.works;
				r.face = pool[Math.floor(Math.random() * pool.length)];
				used.add(r.face);
			}
			const walk = document.querySelector('main');
			walk.innerHTML = rooms
				.map((r, i) => {
					const next = rooms[i + 1];
					return `<section class="door" id="sala-${r.tag}" data-room="${r.tag}">
						<p>Sala ${i + 1} de ${rooms.length}</p>
						<h2>${r.name}</h2>
						<p>${r.works.length} obras${next ? ` · después: ${next.name}` : ''}</p>
					</section>` + r.works.map((a) => work(a).replace('<figure', `<figure data-room="${r.tag}" data-id="${a.id}"`)).join('');
				})
				.join('');

			document.querySelector('.rooms ul').innerHTML = rooms
				.map(
					(r) => `<li><a href="#sala-${r.tag}" data-room="${r.tag}">
						<img src="/images/${r.face.id}.webp" alt="" width="72" height="52"><span>${r.name}</span></a></li>`
				)
				.join('');

			const mass = document.querySelector('.mass');
			mass.innerHTML = rooms
				.map(
					(r) => `<section id="todas-${r.tag}" data-room="${r.tag}">
						<h2>${r.name}<small>${r.works.length} obras</small></h2>
						<ul>${r.works
							.map(
								(a) => `<li><a href="#sala-${r.tag}" data-room="${r.tag}" data-id="${a.id}">
									<img src="/images/${a.id}.webp" alt="" width="${a.w}" height="${a.h}" loading="lazy">
									<span class="label"><span class="title">${esc(a.title)}</span>${a.sold ? '<span class="sold">Vendida</span>' : ''}</span>
								</a></li>`
							)
							.join('')}</ul>
					</section>`
				)
				.join('');

			// The current Room: marked in the Room list and kept in the URL.
			const mark = (tag) => {
				for (const a of document.querySelectorAll('.rooms a'))
					a.toggleAttribute('aria-current', a.dataset.room === tag);
				// On a phone the strip scrolls: bring the current Room into view, but only when it is out of view.
				const strip = document.querySelector('.rooms ul');
				const li = strip.querySelector('[aria-current]').parentElement;
				const outside =
					li.offsetLeft < strip.scrollLeft ||
					li.offsetLeft + li.offsetWidth > strip.scrollLeft + strip.clientWidth;
				if (outside) strip.scrollLeft = li.offsetLeft - 16;
				history.replaceState(null, '', `${location.search}#sala-${tag}`);
			};
			const { go, stops } = corridor(walk, (stop, i) => {
				const tag = stop.dataset.room;
				const room = rooms.find((r) => r.tag === tag);
				const door = stops.indexOf(document.getElementById(`sala-${tag}`));
				mark(tag);
				document.querySelector('output').textContent =
					i === door ? `Sala ${room.name}` : `${room.name} · obra ${i - door} de ${room.works.length}`;
			});
			const jump = (i) => {
				walk.style.scrollBehavior = 'auto';
				go(i);
				walk.style.scrollBehavior = '';
			};

			// Two views: "Paseo" (the corridor) and "Ver todas" (every Room at once). The URL keeps the view.
			const views = document.querySelectorAll('[data-view]');
			const setView = (v) => {
				mass.hidden = v !== 'todas';
				walk.hidden = document.querySelector('.walking').hidden = v === 'todas';
				for (const b of views) b.setAttribute('aria-pressed', b.dataset.view === v);
				history.replaceState(null, '', `${v === 'todas' ? '?vista=todas' : location.pathname}${location.hash}`);
			};
			// A switch keeps the current Room in view.
			for (const b of views)
				b.onclick = () => {
					setView(b.dataset.view);
					open(location.hash.slice('#sala-'.length) || rooms[0].tag);
				};
			// The Room under the strip is the current Room. The mass scrolls itself, or the body on a phone.
			const follow = () => {
				if (mass.hidden) return;
				const line = document.querySelector('.rooms').getBoundingClientRect().bottom + 80;
				const passed = [...mass.children].filter((s) => s.getBoundingClientRect().top <= line);
				mark((passed.at(-1) ?? mass.firstElementChild).dataset.room);
			};
			mass.addEventListener('scroll', follow);
			document.body.addEventListener('scroll', follow);
			// A click on a small image opens that Artwork in the corridor, in the same Room.
			mass.onclick = (e) => {
				const a = e.target.closest('a');
				if (!a) return;
				e.preventDefault();
				setView('paseo');
				jump(stops.findIndex((s) => s.dataset.room === a.dataset.room && s.dataset.id === a.dataset.id));
			};

			const open = (tag) => {
				if (!mass.hidden) {
					document.getElementById(`todas-${tag}`).scrollIntoView();
					mark(tag);
				} else go(stops.indexOf(document.getElementById(`sala-${tag}`)));
			};
			document.querySelector('.rooms ul').onclick = (e) => {
				const a = e.target.closest('a');
				if (!a) return;
				e.preventDefault();
				open(a.dataset.room);
			};
			// A link to a Room opens that Room.
			// Full View: a tap on an Artwork opens it large, with pinch zoom, and its detail images after it.
			// ponytail: the display copies stand in for the originals until they arrive in R2.
			const bp = BiggerPicture({ target: document.documentElement }); // not body: see .top
			const size = (src) =>
				new Promise((ok) => {
					const img = new Image();
					img.onload = () => ok({ img: src, width: img.naturalWidth, height: img.naturalHeight });
					img.src = src;
				});
			walk.addEventListener('click', async (e) => {
				const canvas = e.target.closest('.canvas');
				if (!canvas) return;
				e.preventDefault();
				const a = ARTWORKS.find((x) => x.id === canvas.closest('.work').dataset.id);
				const details = await Promise.all(a.details.map((d) => size(`/images/${a.id}-${d}.webp`)));
				const caption = esc(a.title);
				bp.open({
					el: canvas,
					items: [
						{ img: `/images/${a.id}.webp`, width: a.w, height: a.h, alt: a.title, caption },
						...details.map((d, i) => ({ ...d, alt: `${a.title}, detalle ${i + 1}`, caption: `${caption} · detalle ${i + 1}` }))
					]
				});
			});

			// Back to the top, once the visitor has walked past the header.
			const upButton = document.querySelector('.top');
			document.body.addEventListener('scroll', () => (upButton.hidden = document.body.scrollTop < 400));
			upButton.onclick = () => {
				const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
				document.body.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
			};

			// Measure the header rows for the sticky name (see the CSS above).
			const site = document.querySelector('#site');
			const fit = () => {
				const hide = site.querySelector('nav').getBoundingClientRect().bottom - site.getBoundingClientRect().top;
				site.style.setProperty('--hide', `${hide}px`);
				document.documentElement.style.setProperty('--site-h', `${site.offsetHeight - hide}px`);
			};
			fit();
			addEventListener('resize', fit);
			document.fonts.ready.then(fit);

			setView(new URLSearchParams(location.search).get('vista') === 'todas' ? 'todas' : 'paseo');
			// At the end of the phone walk the site links come back.
			const end = document.querySelector('.end');
			end.innerHTML = document.querySelector('#site nav ul').outerHTML;
			// The prototype controls go to the end of the phone walk, out of the header.
			// The bottom bar is gone: the view switch takes the place of the language link beside
			// the name, and the language link goes first in the Room strip.
			if (PHONE.matches) {
				end.append(document.querySelector('.proto'));
				document.querySelector('#site').append(document.querySelector('.views'));
				document.querySelector('[data-view=todas]').textContent = 'Todas'; // as wide as Paseo
				document.querySelector('.rooms').prepend(document.querySelector('#site .lang'));
			}
			// A link to a Room opens it, once the fonts have set the header height.
			const start = location.hash.slice('#sala-'.length);
			if (document.getElementById(`sala-${start}`))
				document.fonts.ready.then(() => {
					fit();
					if (mass.hidden) jump(stops.indexOf(document.getElementById(`sala-${start}`)));
					else open(start);
				});
		</script>
	</body>
</html>
